[project]
name = "bq-job-diagnose"
version = "0.1.0"
description = "BigQuery ジョブのクエリプランとタイムラインから性能問題を決定論的に診断する CLI"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery>=3.39.0",
  "typer>=0.15.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]
[project.scripts]
bq-job-diagnose = "bq_job_diagnose.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bq_job_diagnose"]
