# ai-native-sdlc-duckdb の CI(クラウドリソース不要: ランナー上で DuckDB を使う)
name: ai-native-sdlc-duckdb-ci
on:
  pull_request:
    paths:
      - "ai-native-sdlc-duckdb/**"
      - ".github/workflows/ai-native-sdlc-duckdb-ci.yml"
defaults:
  run:
    working-directory: ai-native-sdlc-duckdb
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -r requirements.txt
      # GCS の代わりに、main の deploy が上げた artifact を本番 manifest / prod.duckdb として取得
      - uses: dawidd6/action-download-artifact@v6
        continue-on-error: true   # 初回は存在しない → 全件 build
        with:
          workflow: ai-native-sdlc-duckdb-deploy.yml
          branch: main
          name: prod-state
          path: ai-native-sdlc-duckdb
      - run: python scripts/init_ops.py
      - run: bash scripts/ci.sh
        env: { PR_NUMBER: "${{ github.event.number }}", CI_ATTEMPT: "${{ github.run_attempt }}" }
