name: ai-native-sdlc-duckdb-rust-monitor
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
defaults:
  run:
    working-directory: ai-native-sdlc-duckdb-rust
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write, actions: read }
    env:
      MONITOR_MODE: ${{ vars.MONITOR_MODE || 'shadow' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ai-native-sdlc-duckdb-rust }
      - run: cargo build --release --locked -p forge -p monitor
      - uses: dawidd6/action-download-artifact@v6
        with: { workflow: ai-native-sdlc-duckdb-rust-deploy.yml, branch: main, name: prod-state-rust, path: ai-native-sdlc-duckdb-rust }
      - run: ./target/release/monitor collect && ./target/release/monitor detect
      # 注: ランナー上の prod.duckdb への追記は永続化されない。監視履歴を残すなら
      # ops を別 artifact として upload/download するか、ローカル cron で回す。
