# クラウド版の BigQuery データセットを DuckDB ファイルで置き換える。
#   analytics_dev → warehouse/dev.duckdb
#   analytics_ci  → warehouse/ci.duckdb (CI 毎に作り直す)
#   analytics/ops → warehouse/prod.duckdb
# ci は prod.duckdb を read_only で attach し、defer 先として参照する(verifier も ci を使う)。
# dev は attach しない: dev から prod を開くと deploy / monitor とロック競合するため。
# bq_compat は BigQuery 互換チェック専用。接続はせず、dbt v2 の静的解析で
# BigQuery 方言として SQL を型まで解析するだけ(認証情報は不要・入れない)。
sdlc_sample:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_PROJECT_DIR', '.') }}/warehouse/dev.duckdb"
      schema: analytics
      threads: 4
    ci:
      type: duckdb
      path: "{{ env_var('DBT_PROJECT_DIR', '.') }}/warehouse/ci.duckdb"
      schema: "analytics_ci_pr{{ env_var('PR_NUMBER', 'local') }}"
      threads: 4
      attach:
        - path: "{{ env_var('DBT_PROJECT_DIR', '.') }}/warehouse/prod.duckdb"
          alias: prod
          read_only: true
    prod:
      type: duckdb
      path: "{{ env_var('DBT_PROJECT_DIR', '.') }}/warehouse/prod.duckdb"
      schema: analytics
      threads: 4
    bq_compat:
      type: bigquery
      method: oauth
      project: bq-compat-offline
      dataset: analytics
      location: US
      threads: 4
