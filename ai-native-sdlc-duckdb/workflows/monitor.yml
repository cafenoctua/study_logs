name: ai-native-sdlc-duckdb-monitor
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
defaults:
  run:
    working-directory: ai-native-sdlc-duckdb
jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write, actions: read }
    env:
      MONITOR_MODE: ${{ vars.MONITOR_MODE || 'shadow' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -r requirements.txt
      - uses: dawidd6/action-download-artifact@v6
        with: { workflow: ai-native-sdlc-duckdb-deploy.yml, branch: main, name: prod-state, path: ai-native-sdlc-duckdb }
      - run: python monitoring/collect.py && python monitoring/detect.py
      # 注: ランナー上の prod.duckdb への追記は永続化されない。監視履歴を残すなら
      # ops を別 artifact として upload/download するか、ローカル cron で回す。
